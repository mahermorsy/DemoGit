name: FirstGithub Action

on: 
 push:
   branches: 
     - main
     - "feature/**"
   paths:
     - "src/**"
     - "docs/**"
     - ".github/workflows/**" 
 pull_request:
   branches: 
     - main
     - "feature/**"

jobs:
  example-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6.1.0

    - name: run tests
      run: npm test

    - name: Print messages
      run: |
            echo "Welcome to GitHub Actions"
            echo "Starting CI/CD Pipeline"
            echo "Build Started"

    - name: List Repository Files
      run: ls -la